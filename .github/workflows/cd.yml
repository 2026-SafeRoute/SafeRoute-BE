name: CD

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: EC2 배포
        required: true
        default: be-only
        type: choice
        options:
          - be-only
          - ai-only
          - all

# 잡별로 필요한 권한만 개별 permissions 블록에서 확장한다.
permissions:
  contents: read

concurrency:
  group: saferoute-production
  cancel-in-progress: false

jobs:
  # EC2(self-hosted)는 RAM 1.9GB/Disk 8GB로 빌드+테스트를 감당하지 못해
  # 러너 프로세스가 죽는 문제가 있었다. 빌드/테스트/이미지 빌드는 GitHub-hosted
  # 러너에서 수행하고, EC2는 완성된 이미지를 pull해서 배포만 담당한다.
  build-and-push-be:
    name: Build and push BE image
    if: ${{ inputs.deploy_target == 'be-only' || inputs.deploy_target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # 같은 커밋이면 build-and-push-be와 deploy 잡이 항상 같은 태그를 계산하므로
      # job outputs로 잇지 않고 각자 github.sha로부터 독립 계산한다.
      # GHCR 경로는 소문자만 허용해 github.repository_owner(2026-SafeRoute)를 그대로 쓸 수 없으므로
      # 조직 이름을 소문자로 고정한다. 조직 이름이 바뀌면 여기와 deploy 잡의 APP_IMAGE를 함께 바꿔야 한다.
      APP_IMAGE: ghcr.io/2026-saferoute/saferoute-be:${{ github.sha }}

    steps:
      - name: Checkout BE repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests and build jar
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          docker build -t "$APP_IMAGE" .
          docker push "$APP_IMAGE"

  deploy:
    name: Deploy ${{ inputs.deploy_target }}
    needs: [build-and-push-be]
    if: |
      always() &&
      (needs.build-and-push-be.result == 'success' || needs.build-and-push-be.result == 'skipped')
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 60

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        shell: bash

    env:
      DEPLOY_ROOT: /opt/saferoute
      STAGING_ROOT: /opt/saferoute/.staging/${{ github.run_id }}-${{ github.run_attempt }}
      BACKUP_ROOT: /opt/saferoute/.previous/${{ github.run_id }}-${{ github.run_attempt }}
      ENV_FILE: /opt/saferoute/.env
      # 실행 위치가 달라도 같은 Compose 프로젝트/컨테이너를 사용한다.
      COMPOSE_PROJECT_NAME: saferoute
      # build-and-push-be와 동일한 규칙(github.sha)으로 계산해 같은 커밋이면
      # 항상 같은 이미지를 가리키게 한다. ai-only에서는 사용되지 않는다.
      APP_IMAGE: ghcr.io/2026-saferoute/saferoute-be:${{ github.sha }}

    steps:
      - name: Reclaim deployment disk space
        run: |
          set -euo pipefail

          docker --version
          docker compose version

          sudo install -d -m 0755 -o "$USER" -g "$USER" \
            "$DEPLOY_ROOT" \
            "$DEPLOY_ROOT/.staging" \
            "$DEPLOY_ROOT/.previous"

          echo "Disk usage before cleanup"
          df -h "$DEPLOY_ROOT"
          docker system df || true
          sudo du -xhd1 "$DEPLOY_ROOT" 2>/dev/null | sort -h || true
          du -sh "$HOME/.gradle" "$GITHUB_WORKSPACE" 2>/dev/null || true
          while IFS= read -r container_id; do
            log_path="$(docker inspect --format '{{.LogPath}}' "$container_id")"
            [ -z "$log_path" ] || sudo du -h -- "$log_path" 2>/dev/null || true
          done < <(
            docker ps -aq \
              --filter 'label=com.docker.compose.project=saferoute'
          )

          # concurrency로 배포가 직렬화되므로 남아 있는 staging은 이전에
          # 비정상 종료된 실행의 찌꺼기다. 체크아웃보다 먼저 제거한다.
          while IFS= read -r -d '' stale_staging; do
            case "$stale_staging" in
              "$DEPLOY_ROOT/.staging/"*) sudo rm -rf -- "$stale_staging" ;;
              *) echo "::error::안전하지 않은 staging 경로: $stale_staging"; exit 1 ;;
            esac
          done < <(
            find "$DEPLOY_ROOT/.staging" -mindepth 1 -maxdepth 1 \
              -type d -print0
          )

          # 수동 복구용 최신 소스 백업 하나만 남긴다. AI 모델이 포함된 백업을
          # 두 개 이상 보관하면 8GB 디스크에서 다음 빌드 공간이 부족해진다.
          mapfile -t old_backups < <(
            find "$DEPLOY_ROOT/.previous" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2-
          )
          for old_backup in "${old_backups[@]}"; do
            case "$old_backup" in
              "$DEPLOY_ROOT/.previous/"*) sudo rm -rf -- "$old_backup" ;;
              *) echo "::error::안전하지 않은 backup 경로: $old_backup"; exit 1 ;;
            esac
          done

          # 소스 롤백에는 Gradle 산출물과 프로젝트 캐시가 필요하지 않다.
          # 남겨 둔 최신 백업에서도 재생성 가능한 파일을 제거한다.
          while IFS= read -r -d '' retained_backup; do
            case "$retained_backup" in
              "$DEPLOY_ROOT/.previous/"*)
                sudo rm -rf -- \
                  "$retained_backup/SafeRoute-BE/build" \
                  "$retained_backup/SafeRoute-BE/.gradle"
                ;;
              *) echo "::error::안전하지 않은 backup 경로: $retained_backup"; exit 1 ;;
            esac
          done < <(
            find "$DEPLOY_ROOT/.previous" -mindepth 1 -maxdepth 1 \
              -type d -print0
          )

          # 중단된 Compose 일회성 테스트 컨테이너가 남았으면 먼저 제거한다.
          # app/ai 서비스 컨테이너는 oneoff 라벨이 없으므로 대상이 아니다.
          docker container prune -f \
            --filter 'label=com.docker.compose.project=saferoute' \
            --filter 'label=com.docker.compose.oneoff=True'

          # 실행 중이거나 중단된 컨테이너가 하나라도 참조하는 이미지는 보존된다.
          # 실패한 후보 이미지와 재생성 가능한 빌드 캐시만 제거한다.
          docker image prune -af
          docker builder prune -af
          if docker buildx version >/dev/null 2>&1; then
            docker buildx prune -af
          fi

          echo "Disk usage after cleanup"
          df -h "$DEPLOY_ROOT"
          docker system df || true

      - name: Checkout BE repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout AI floor_analysis
        if: ${{ inputs.deploy_target == 'ai-only' || inputs.deploy_target == 'all' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.AI_REPOSITORY }}
          path: SafeRoute-AI
          persist-credentials: false
          sparse-checkout: |
            floor_analysis
          sparse-checkout-cone-mode: true
          lfs: true

      - name: Validate runner environment
        run: |
          set -euo pipefail

          test -s "$ENV_FILE" || {
            echo "::error::$ENV_FILE 파일이 없거나 비어 있습니다."
            exit 1
          }

          sudo install -d -m 0755 -o "$USER" -g "$USER" \
            "$DEPLOY_ROOT" \
            "$DEPLOY_ROOT/.staging" \
            "$DEPLOY_ROOT/.previous"
          sudo chown "$USER":"$USER" "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          # 체크아웃 및 선제 정리 후에도 빌드를 시작할 최소 여유가 있는지 확인한다.
          available_kb="$(df -Pk "$DEPLOY_ROOT" | awk 'NR == 2 { print $4 }')"
          minimum_kb=$((1 * 1024 * 1024))
          test -n "$available_kb" || {
            echo "::error::$DEPLOY_ROOT의 여유 공간을 확인할 수 없습니다."
            exit 1
          }
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "::error::배포에 필요한 여유 공간이 부족합니다. 정리 후 최소 1GB가 필요합니다."
            df -h "$DEPLOY_ROOT"
            exit 1
          fi

      - name: Stage deployment sources
        run: |
          set -euo pipefail

          # rm -rf 대상이 반드시 이번 실행 전용 하위 경로인지 먼저 검증한다.
          case "$STAGING_ROOT" in
            "$DEPLOY_ROOT/.staging/"*) ;;
            *) echo "::error::안전하지 않은 STAGING_ROOT: $STAGING_ROOT"; exit 1 ;;
          esac
          case "$BACKUP_ROOT" in
            "$DEPLOY_ROOT/.previous/"*) ;;
            *) echo "::error::안전하지 않은 BACKUP_ROOT: $BACKUP_ROOT"; exit 1 ;;
          esac

          # 실행별 새 경로만 정리한다. 현재 운영 디렉터리는 건드리지 않는다.
          sudo rm -rf -- "$STAGING_ROOT" "$BACKUP_ROOT"
          sudo install -d -m 0755 -o "$USER" -g "$USER" \
            "$STAGING_ROOT/SafeRoute-BE" \
            "$BACKUP_ROOT"

          # AI 저장소와 로컬 빌드 산출물을 처음부터 제외해, 큰 모델 파일을 BE
          # staging에 복사했다가 다시 지우는 순간적인 디스크 중복을 피한다.
          tar -C "$GITHUB_WORKSPACE" \
            --exclude='./.git' \
            --exclude='./.gradle' \
            --exclude='./build' \
            --exclude='./SafeRoute-AI' \
            -cf - . | tar -C "$STAGING_ROOT/SafeRoute-BE" -xf -

          if [[ "${{ inputs.deploy_target }}" == "ai-only" || \
                "${{ inputs.deploy_target }}" == "all" ]]; then
            test -d "$GITHUB_WORKSPACE/SafeRoute-AI/floor_analysis"
            # checkout과 /opt가 같은 운영 디스크이므로 파일을 hard link한다.
            # LFS 모델의 데이터 블록은 중복하지 않으면서 checkout의 post-job
            # 정리가 사용할 원래 workspace 경로는 그대로 보존한다.
            sudo cp -al "$GITHUB_WORKSPACE/SafeRoute-AI" \
              "$STAGING_ROOT/SafeRoute-AI"
            sudo rm -rf -- "$STAGING_ROOT/SafeRoute-AI/.git"
          fi

          sudo chown -R "$USER":"$USER" "$STAGING_ROOT" "$BACKUP_ROOT"

          test -f "$STAGING_ROOT/SafeRoute-BE/docker-compose.prod.yml"
          test -f "$STAGING_ROOT/SafeRoute-BE/gradlew"

          if [[ "${{ inputs.deploy_target }}" == "ai-only" || \
                "${{ inputs.deploy_target }}" == "all" ]]; then
            test -d "$STAGING_ROOT/SafeRoute-AI/floor_analysis"
          fi

      - name: Validate production Compose
        run: |
          set -euo pipefail

          cd "$STAGING_ROOT/SafeRoute-BE"
          docker compose \
            --env-file "$ENV_FILE" \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Pull BE candidate image
        if: ${{ inputs.deploy_target == 'be-only' || inputs.deploy_target == 'all' }}
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$APP_IMAGE"

      - name: Build and test AI candidate
        if: ${{ inputs.deploy_target == 'ai-only' || inputs.deploy_target == 'all' }}
        run: |
          set -euo pipefail

          cd "$STAGING_ROOT/SafeRoute-BE"
          docker compose \
            --env-file "$ENV_FILE" \
            -f docker-compose.prod.yml \
            build ai
          docker compose \
            --env-file "$ENV_FILE" \
            -f docker-compose.prod.yml \
            run --rm --no-deps ai python test_pipeline.py

      - name: Remove candidate build artifacts
        if: always()
        run: |
          set -euo pipefail

          case "$STAGING_ROOT" in
            "$DEPLOY_ROOT/.staging/"*) ;;
            *) echo "::error::안전하지 않은 STAGING_ROOT: $STAGING_ROOT"; exit 1 ;;
          esac
          sudo rm -rf -- \
            "$STAGING_ROOT/SafeRoute-BE/build" \
            "$STAGING_ROOT/SafeRoute-BE/.gradle"

      - name: Deploy AI and BE
        if: ${{ inputs.deploy_target == 'all' }}
        run: |
          set -Eeuo pipefail

          live_be_dir="$DEPLOY_ROOT/SafeRoute-BE"
          staged_be_dir="$STAGING_ROOT/SafeRoute-BE"
          backup_be_dir="$BACKUP_ROOT/SafeRoute-BE"
          live_ai_dir="$DEPLOY_ROOT/SafeRoute-AI"
          staged_ai_dir="$STAGING_ROOT/SafeRoute-AI"
          backup_ai_dir="$BACKUP_ROOT/SafeRoute-AI"

          previous_app_image=""
          previous_ai_image=""
          app_rollback_tag=""
          ai_rollback_tag=""
          be_source_promoted="false"
          ai_source_promoted="false"
          deployment_started="false"

          compose() {
            docker compose \
              --env-file "$ENV_FILE" \
              -f "$live_be_dir/docker-compose.prod.yml" \
              --project-directory "$live_be_dir" \
              "$@"
          }

          wait_for_ai() {
            container_id="$(compose ps -q ai)"
            test -n "$container_id" || {
              echo "::error::AI 컨테이너를 찾을 수 없습니다."
              return 1
            }

            for attempt in $(seq 1 60); do
              status="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$container_id"
              )"
              echo "AI health status: $status ($attempt/60)"

              [ "$status" = "healthy" ] && return 0
              if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
                echo "::error::AI 컨테이너 상태: $status"
                return 1
              fi
              sleep 5
            done

            echo "::error::AI 서비스가 제한 시간 내 healthy 상태가 되지 않았습니다."
            return 1
          }

          wait_for_app() {
            local container_id status response
            container_id="$(compose ps -q app)"
            test -n "$container_id" || {
              echo "::error::app 컨테이너를 찾을 수 없습니다."
              return 1
            }

            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              echo "app status: $status ($attempt/60)"

              if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "::error::app 컨테이너 상태: $status"
                docker logs --tail 200 "$container_id" || true
                return 1
              fi

              # Spring Boot가 포트를 연 직후 연결을 재설정할 수도 있다.
              # curl 실패는 준비 중인 상태로 취급하고 다음 시도까지 기다린다.
              if response="$(
                curl --fail --silent --show-error \
                  --connect-timeout 3 --max-time 10 \
                  http://127.0.0.1:8080/actuator/health 2>&1
              )" && grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <<<"$response"; then
                printf '%s\n' "$response"
                return 0
              fi

              echo "app health pending: $response"
              sleep 5
            done

            echo "::error::app 서비스가 제한 시간 내 정상화되지 않았습니다."
            docker logs --tail 200 "$container_id" || true
            return 1
          }

          # 롤백은 배포 전 정상 상태였던 두 이미지를 한 쌍으로만 수행한다.
          # 한쪽만 복구하면 app -> ai의 service_healthy 계약을 다시 깨뜨릴 수 있다.
          if [ -f "$live_be_dir/docker-compose.prod.yml" ]; then
            current_ai_container="$(compose ps -q ai)"
            if [ -n "$current_ai_container" ]; then
              current_ai_status="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$current_ai_container"
              )"
              if [ "$current_ai_status" = "healthy" ]; then
                previous_ai_image="$(docker inspect --format '{{.Image}}' "$current_ai_container")"
              fi
            fi

            current_app_container="$(compose ps -q app)"
            if [ -n "$current_app_container" ] && \
               curl --fail --silent --max-time 10 \
                 http://127.0.0.1:8080/actuator/health >/dev/null; then
              previous_app_image="$(docker inspect --format '{{.Image}}' "$current_app_container")"
            fi

            if [ -n "$previous_ai_image" ] && [ -n "$previous_app_image" ]; then
              ai_rollback_tag="saferoute-rollback-ai:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              app_rollback_tag="saferoute-rollback-app:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              docker image tag "$previous_ai_image" "$ai_rollback_tag"
              docker image tag "$previous_app_image" "$app_rollback_tag"
            fi
          fi

          restore_sources() {
            if [ "$be_source_promoted" = "true" ]; then
              if [ -d "$backup_be_dir" ]; then
                sudo rm -rf -- "$live_be_dir"
                sudo mv "$backup_be_dir" "$live_be_dir"
              else
                echo "::warning::이전 BE 소스가 없어 새 운영 소스를 보존합니다: $live_be_dir"
              fi
            fi

            if [ "$ai_source_promoted" = "true" ]; then
              if [ -d "$backup_ai_dir" ]; then
                sudo rm -rf -- "$live_ai_dir"
                sudo mv "$backup_ai_dir" "$live_ai_dir"
              else
                echo "::warning::이전 AI 소스가 없어 새 운영 소스를 보존합니다: $live_ai_dir"
              fi
            fi
          }

          rollback() {
            exit_code=$?
            trap - ERR
            set +e

            restore_sources

            if [ "$deployment_started" = "true" ]; then
              if [ -n "$ai_rollback_tag" ] && [ -n "$app_rollback_tag" ] && \
                 [ -f "$live_be_dir/docker-compose.prod.yml" ]; then
                echo "::warning::all 배포 실패. AI와 app의 이전 소스 및 정상 이미지로 함께 복구합니다."
                rollback_file="$(mktemp)"
                printf 'services:\n  ai:\n    image: %s\n  app:\n    image: %s\n' \
                  "$ai_rollback_tag" "$app_rollback_tag" > "$rollback_file"

                docker compose \
                  --env-file "$ENV_FILE" \
                  -f "$live_be_dir/docker-compose.prod.yml" \
                  -f "$rollback_file" \
                  --project-directory "$live_be_dir" \
                  up -d --no-deps --no-build --force-recreate ai
                ai_restore_status=$?

                if [ "$ai_restore_status" -eq 0 ]; then
                  wait_for_ai
                  ai_restore_status=$?
                fi

                if [ "$ai_restore_status" -eq 0 ]; then
                  docker compose \
                    --env-file "$ENV_FILE" \
                    -f "$live_be_dir/docker-compose.prod.yml" \
                    -f "$rollback_file" \
                    --project-directory "$live_be_dir" \
                    up -d --no-deps --no-build --force-recreate app
                  app_restore_status=$?
                else
                  app_restore_status=1
                fi

                if [ "$app_restore_status" -eq 0 ]; then
                  wait_for_app
                  app_restore_status=$?
                fi

                rm -f "$rollback_file"
                if [ "$ai_restore_status" -ne 0 ] || [ "$app_restore_status" -ne 0 ]; then
                  echo "::error::AI/app 자동 롤백이 완료되지 않았습니다."
                fi
              else
                echo "::error::all 배포에 실패했고 복구 가능한 AI/app 정상 이미지 쌍이 없습니다."
                if [ -f "$live_be_dir/docker-compose.prod.yml" ]; then
                  compose rm -sf app ai || true
                fi
              fi
            fi

            [ -z "$ai_rollback_tag" ] || \
              docker image rm "$ai_rollback_tag" >/dev/null 2>&1 || true
            [ -z "$app_rollback_tag" ] || \
              docker image rm "$app_rollback_tag" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap rollback ERR

          # 두 후보 소스를 같은 실패 처리 범위 안에서 운영 경로로 승격한다.
          if [ -e "$live_be_dir" ]; then
            sudo mv "$live_be_dir" "$backup_be_dir"
          fi
          sudo mv "$staged_be_dir" "$live_be_dir"
          sudo chown -R "$USER":"$USER" "$live_be_dir"
          be_source_promoted="true"

          if [ -e "$live_ai_dir" ]; then
            sudo mv "$live_ai_dir" "$backup_ai_dir"
          fi
          sudo mv "$staged_ai_dir" "$live_ai_dir"
          sudo chown -R "$USER":"$USER" "$live_ai_dir"
          ai_source_promoted="true"

          test -f "$live_be_dir/docker-compose.prod.yml"
          test -f "$live_be_dir/gradlew"
          test -d "$live_ai_dir/floor_analysis"

          deployment_started="true"

          # app보다 AI 후보를 먼저 시작하고 Compose health 및 HTTP health를 확인한다.
          compose up -d --no-deps --no-build ai
          wait_for_ai
          compose exec -T ai python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read().decode())"

          # AI가 healthy가 된 뒤 app을 시작한다. --no-deps를 사용하지 않아
          # docker-compose.prod.yml의 service_healthy 의존성 계약도 유지한다.
          compose up -d --no-build app
          wait_for_app

          test -f "$live_be_dir/docker-compose.prod.yml"
          test -d "$live_ai_dir/floor_analysis"

          trap - ERR
          [ -z "$ai_rollback_tag" ] || \
            docker image rm "$ai_rollback_tag" >/dev/null 2>&1 || true
          [ -z "$app_rollback_tag" ] || \
            docker image rm "$app_rollback_tag" >/dev/null 2>&1 || true

      - name: Deploy BE
        if: ${{ inputs.deploy_target == 'be-only' }}
        run: |
          set -Eeuo pipefail

          live_dir="$DEPLOY_ROOT/SafeRoute-BE"
          staged_dir="$STAGING_ROOT/SafeRoute-BE"
          backup_dir="$BACKUP_ROOT/SafeRoute-BE"
          previous_image=""
          rollback_tag=""
          source_promoted="false"
          deployment_started="false"

          compose() {
            docker compose \
              --env-file "$ENV_FILE" \
              -f "$live_dir/docker-compose.prod.yml" \
              --project-directory "$live_dir" \
              "$@"
          }

          wait_for_app() {
            local container_id status response
            container_id="$(compose ps -q app)"
            test -n "$container_id" || {
              echo "::error::app 컨테이너를 찾을 수 없습니다."
              return 1
            }

            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              echo "app status: $status ($attempt/60)"

              if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "::error::app 컨테이너 상태: $status"
                docker logs --tail 200 "$container_id" || true
                return 1
              fi

              if response="$(
                curl --fail --silent --show-error \
                  --connect-timeout 3 --max-time 10 \
                  http://127.0.0.1:8080/actuator/health 2>&1
              )"; then
                printf '%s\n' "$response"
                return 0
              fi

              echo "app health pending: $response"
              sleep 5
            done

            echo "::error::app 서비스가 제한 시간 내 정상화되지 않았습니다."
            docker logs --tail 200 "$container_id" || true
            return 1
          }

          current_container=""
          if [ -f "$live_dir/docker-compose.prod.yml" ]; then
            current_container="$(compose ps -q app)"
          fi
          if [ -n "$current_container" ] && \
             curl --fail --silent --max-time 10 \
               http://127.0.0.1:8080/actuator/health >/dev/null; then
            previous_image="$(docker inspect --format '{{.Image}}' "$current_container")"
            rollback_tag="saferoute-rollback-app:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker image tag "$previous_image" "$rollback_tag"
          fi

          restore_source() {
            if [ "$source_promoted" = "true" ]; then
              if [ -d "$backup_dir" ]; then
                # 복구할 백업이 확인된 경우에만 현재 운영 소스를 제거한다.
                sudo rm -rf -- "$live_dir"
                sudo mv "$backup_dir" "$live_dir"
              else
                # 첫 배포에는 백업이 없다. 이때 새 소스를 삭제하면 실행 중인
                # 컨테이너만 남고 Compose 파일이 사라지므로 그대로 보존한다.
                echo "::warning::이전 BE 소스가 없어 새 운영 소스를 보존합니다: $live_dir"
              fi
            fi
          }

          rollback() {
            exit_code=$?
            trap - ERR

            restore_source

            if [ "$deployment_started" = "true" ] && [ -n "$rollback_tag" ] && \
               [ -f "$live_dir/docker-compose.prod.yml" ]; then
              echo "::warning::BE 배포 실패. 이전 소스와 정상 이미지로 복구합니다."
              rollback_file="$(mktemp)"
              printf 'services:\n  app:\n    image: %s\n' "$rollback_tag" > "$rollback_file"

              docker compose \
                --env-file "$ENV_FILE" \
                -f "$live_dir/docker-compose.prod.yml" \
                -f "$rollback_file" \
                --project-directory "$live_dir" \
                up -d --no-deps --no-build --force-recreate app
              rm -f "$rollback_file"

              wait_for_app
            elif [ "$deployment_started" = "true" ]; then
              echo "::error::BE 배포에 실패했고 복구 가능한 이전 정상 이미지가 없습니다."
            fi

            [ -z "$rollback_tag" ] || \
              docker image rm "$rollback_tag" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap rollback ERR

          # 후보 검증 완료 후에만 운영 경로를 교체하며, 이전 소스는 backup에 보존한다.
          if [ -e "$live_dir" ]; then
            sudo mv "$live_dir" "$backup_dir"
          fi
          sudo mv "$staged_dir" "$live_dir"
          sudo chown -R "$USER":"$USER" "$live_dir"
          source_promoted="true"
          test -f "$live_dir/docker-compose.prod.yml"
          test -f "$live_dir/gradlew"

          deployment_started="true"
          compose up -d --no-deps --no-build app
          wait_for_app
          test -f "$live_dir/docker-compose.prod.yml"

          # 이전 운영 소스는 장애 시 수동 복구를 위해 .previous에 보존한다.
          trap - ERR
          [ -z "$rollback_tag" ] || \
            docker image rm "$rollback_tag" >/dev/null 2>&1 || true

      - name: Deploy AI
        if: ${{ inputs.deploy_target == 'ai-only' }}
        run: |
          set -Eeuo pipefail

          live_be_dir="$DEPLOY_ROOT/SafeRoute-BE"
          staged_be_dir="$STAGING_ROOT/SafeRoute-BE"
          backup_be_dir="$BACKUP_ROOT/SafeRoute-BE"
          live_dir="$DEPLOY_ROOT/SafeRoute-AI"
          staged_dir="$STAGING_ROOT/SafeRoute-AI"
          backup_dir="$BACKUP_ROOT/SafeRoute-AI"
          previous_image=""
          rollback_tag=""
          be_source_promoted="false"
          source_promoted="false"
          deployment_started="false"

          test -f "$live_be_dir/docker-compose.prod.yml"

          compose() {
            docker compose \
              --env-file "$ENV_FILE" \
              -f "$live_be_dir/docker-compose.prod.yml" \
              --project-directory "$live_be_dir" \
              "$@"
          }

          wait_for_ai() {
            container_id="$(compose ps -q ai)"
            test -n "$container_id" || {
              echo "::error::AI 컨테이너를 찾을 수 없습니다."
              return 1
            }

            for attempt in $(seq 1 60); do
              status="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$container_id"
              )"
              echo "AI health status: $status ($attempt/60)"

              [ "$status" = "healthy" ] && return 0
              if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
                echo "::error::AI 컨테이너 상태: $status"
                return 1
              fi
              sleep 5
            done

            echo "::error::AI 서비스가 제한 시간 내 healthy 상태가 되지 않았습니다."
            return 1
          }

          current_container="$(compose ps -q ai)"
          if [ -n "$current_container" ]; then
            current_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$current_container"
            )"
            if [ "$current_status" = "healthy" ]; then
              previous_image="$(docker inspect --format '{{.Image}}' "$current_container")"
              rollback_tag="saferoute-rollback-ai:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              docker image tag "$previous_image" "$rollback_tag"
            fi
          fi

          restore_source() {
            if [ "$source_promoted" = "true" ]; then
              if [ -d "$backup_dir" ]; then
                sudo rm -rf -- "$live_dir"
                sudo mv "$backup_dir" "$live_dir"
              else
                echo "::warning::이전 AI 소스가 없어 새 운영 소스를 보존합니다: $live_dir"
              fi
            fi

            if [ "$be_source_promoted" = "true" ]; then
              if [ -d "$backup_be_dir" ]; then
                sudo rm -rf -- "$live_be_dir"
                sudo mv "$backup_be_dir" "$live_be_dir"
              else
                echo "::warning::이전 BE 소스가 없어 새 운영 소스를 보존합니다: $live_be_dir"
              fi
            fi
          }

          rollback() {
            exit_code=$?
            trap - ERR

            restore_source

            if [ "$deployment_started" = "true" ] && [ -n "$rollback_tag" ]; then
              echo "::warning::AI 배포 실패. 이전 소스와 정상 이미지로 복구합니다."
              rollback_file="$(mktemp)"
              printf 'services:\n  ai:\n    image: %s\n' "$rollback_tag" > "$rollback_file"
              docker compose \
                --env-file "$ENV_FILE" \
                -f "$live_be_dir/docker-compose.prod.yml" \
                -f "$rollback_file" \
                --project-directory "$live_be_dir" \
                up -d --no-deps --no-build --force-recreate ai
              rm -f "$rollback_file"
              wait_for_ai
            elif [ "$deployment_started" = "true" ]; then
              echo "::error::AI 배포에 실패했고 복구 가능한 이전 정상 이미지가 없습니다."
            fi

            [ -z "$rollback_tag" ] || \
              docker image rm "$rollback_tag" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap rollback ERR

          # ai-only도 이번 체크아웃의 Compose로 빌드했으므로 BE 소스를 함께 승격한다.
          # BE 컨테이너는 재시작하지 않으며, AI health check 전까지 이전 BE 소스를 보존한다.
          if [[ "${{ inputs.deploy_target }}" == "ai-only" ]]; then
            if [ -e "$live_be_dir" ]; then
              sudo mv "$live_be_dir" "$backup_be_dir"
            fi
            sudo mv "$staged_be_dir" "$live_be_dir"
            sudo chown -R "$USER":"$USER" "$live_be_dir"
            be_source_promoted="true"
            test -f "$live_be_dir/docker-compose.prod.yml"
          fi

          if [ -e "$live_dir" ]; then
            sudo mv "$live_dir" "$backup_dir"
          fi
          sudo mv "$staged_dir" "$live_dir"
          sudo chown -R "$USER":"$USER" "$live_dir"
          source_promoted="true"
          test -d "$live_dir/floor_analysis"

          deployment_started="true"
          compose up -d --no-deps --no-build ai
          wait_for_ai
          compose exec -T ai python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read().decode())"
          test -f "$live_be_dir/docker-compose.prod.yml"

          trap - ERR
          [ -z "$rollback_tag" ] || \
            docker image rm "$rollback_tag" >/dev/null 2>&1 || true

      - name: Show deployment status
        if: always()
        run: |
          set -euo pipefail

          live_be_dir="$DEPLOY_ROOT/SafeRoute-BE"
          test -f "$live_be_dir/docker-compose.prod.yml" || {
            echo "::error::배포 후 Compose 파일이 사라졌습니다: $live_be_dir/docker-compose.prod.yml"
            exit 1
          }
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$live_be_dir/docker-compose.prod.yml" \
            --project-directory "$live_be_dir" \
            ps

      - name: Clean this run staging directory
        if: always()
        run: |
          set -euo pipefail

          case "$STAGING_ROOT" in
            "$DEPLOY_ROOT/.staging/"*) ;;
            *) echo "::error::안전하지 않은 STAGING_ROOT: $STAGING_ROOT"; exit 1 ;;
          esac
          # 실행별 staging만 제거한다. 실패 시 남겨둔 backup은 수동 복구용으로 보존한다.
          sudo rm -rf -- "$STAGING_ROOT"

      - name: Prune old source backups
        if: always()
        run: |
          set -euo pipefail

          test -d "$DEPLOY_ROOT/.previous" || exit 0

          # 성공/실패와 무관하게 수동 복구용 최신 백업 하나만 남긴다.
          mapfile -t old_backups < <(
            find "$DEPLOY_ROOT/.previous" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2-
          )
          for old_backup in "${old_backups[@]}"; do
            case "$old_backup" in
              "$DEPLOY_ROOT/.previous/"*) sudo rm -rf -- "$old_backup" ;;
              *) echo "::error::안전하지 않은 backup 경로: $old_backup"; exit 1 ;;
            esac
          done

          while IFS= read -r -d '' retained_backup; do
            case "$retained_backup" in
              "$DEPLOY_ROOT/.previous/"*)
                sudo rm -rf -- \
                  "$retained_backup/SafeRoute-BE/build" \
                  "$retained_backup/SafeRoute-BE/.gradle"
                ;;
              *) echo "::error::안전하지 않은 backup 경로: $retained_backup"; exit 1 ;;
            esac
          done < <(
            find "$DEPLOY_ROOT/.previous" -mindepth 1 -maxdepth 1 \
              -type d -print0
          )

      - name: Prune unused Docker data
        if: always()
        run: |
          set -euo pipefail

          # 서비스 컨테이너와 볼륨은 삭제하지 않는다. 실패한 일회성 테스트
          # 컨테이너와 후보 이미지도 다음 배포까지 남기지 않는다.
          docker container prune -f \
            --filter 'label=com.docker.compose.project=saferoute' \
            --filter 'label=com.docker.compose.oneoff=True'
          docker image prune -af
          docker builder prune -af
          if docker buildx version >/dev/null 2>&1; then
            docker buildx prune -af
          fi

      - name: Show final disk usage
        if: always()
        run: |
          set -euo pipefail

          df -h "$DEPLOY_ROOT"
          docker system df || true
          sudo du -xhd1 "$DEPLOY_ROOT" 2>/dev/null | sort -h || true
          du -sh "$HOME/.gradle" "$GITHUB_WORKSPACE" 2>/dev/null || true
          while IFS= read -r container_id; do
            log_path="$(docker inspect --format '{{.LogPath}}' "$container_id")"
            [ -z "$log_path" ] || sudo du -h -- "$log_path" 2>/dev/null || true
          done < <(
            docker ps -aq \
              --filter 'label=com.docker.compose.project=saferoute'
          )

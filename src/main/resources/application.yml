spring:
  application:
    name: SafeRoute

  profiles:
    default: local

  task:
    scheduling:
      # 화재 확산/훈련 타임아웃/유도등 명령 타임아웃 스케줄러에 WebSocket STOMP 하트비트까지 같은 스케줄러를
      # 쓰므로(WebSocketConfig 참고), 기본 1스레드면 한 스케줄 작업이 길어질 때 하트비트가 밀려 연결이 끊긴다.
      pool:
        size: 4

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # 배치 크기 미설정 시 Hibernate가 saveAll()도 INSERT를 한 건씩 보낸다.
          # 그리드 생성/재생성(FloorGridService)이 셀 크기를 작게 잡을수록(예: 1m 미만)
          # FloorGridCell을 수만~수십만 건 saveAll()로 저장하는데, 배치가 없으면 이게
          # 왕복 지연만큼 느려져서 요청이 타임아웃되고 "그리드가 안 불러와짐"으로 보인다.
          batch_size: 100
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ds-saferoute.site,https://dev-safe-route-fe.vercel.app}

jwt:
  secret: ${JWT_SECRET}
  issuer: saferoute
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

aws:
  region: ${AWS_REGION:us-east-2}

  s3:
    bucket: ${S3_BUCKET}
    # Pi가 URL을 받은 뒤 업로드까지 업링크 지연/재시도로 1분을 넘기면 403이 나서 그 초의 카메라 이미지가
    # 통째로 빠진다. 관측 주기(1초)보다 훨씬 넉넉하게 5분으로 잡는다.
    presigned-url-expiration: 5m
    # 훈련이 진행되는 동안 도면/관측 이미지를 계속 띄워놔야 하므로 업로드용(1분)보다 넉넉하게 1시간으로 잡는다.
    presigned-get-url-expiration: 1h

  dynamodb:
    table-name: ${DYNAMODB_TABLE:saferoute-telemetry}
    gsi1-name: ${DYNAMODB_GSI1_NAME:GSI1}

saferoute:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
